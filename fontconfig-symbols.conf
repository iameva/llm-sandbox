<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Installed as /etc/fonts/conf.d/99-symbol-fallback.conf.

  Firefox's fallback for a missing glyph searches the generic family's font
  list and stops there; it never reaches the Noto symbol fonts, so glyphs
  like U+23F1 (stopwatch) and U+23F9 (stop) draw as a hex box even though
  Noto Sans Symbols 2 is installed. Chromium finds them on its own.

  Appending the symbol fonts to every generic family fixes Firefox and
  leaves Chromium alone. Use accept, not prefer: prefer puts these fonts
  ahead of DejaVu and Liberation and changes the shape of glyphs that
  already rendered (the gear, for one).
-->
<fontconfig>
  <alias binding="weak">
    <family>sans-serif</family>
    <accept><family>Noto Sans Symbols 2</family><family>Noto Sans Symbols</family></accept>
  </alias>
  <alias binding="weak">
    <family>serif</family>
    <accept><family>Noto Sans Symbols 2</family><family>Noto Sans Symbols</family></accept>
  </alias>
  <alias binding="weak">
    <family>monospace</family>
    <accept><family>Noto Sans Symbols 2</family><family>Noto Sans Symbols</family></accept>
  </alias>
  <alias binding="weak">
    <family>system-ui</family>
    <accept><family>Noto Sans Symbols 2</family><family>Noto Sans Symbols</family></accept>
  </alias>
</fontconfig>
